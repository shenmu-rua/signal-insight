[project]
name = "signal-insight"                 # 发行名：pip 用，习惯用短横线
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]                         # 包在 src/ 下面